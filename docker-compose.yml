services:
  cve-watch:
    build: .
    container_name: cve-watch
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # ":Z" tells Docker to relabel the bind mount for SELinux (AlmaLinux/RHEL).
      # Harmless on systems without SELinux.
      - ./data:/app/data:Z
