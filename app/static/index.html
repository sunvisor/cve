<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CVE Watch</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>🛡️ CVE Watch</h1>
    <div class="topbar-right">
      <span id="last-polled" class="muted"></span>
      <button id="poll-btn" class="btn">今すぐチェック</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="cves">脆弱性</button>
    <button class="tab" data-tab="watches">監視ワード</button>
  </nav>

  <!-- ===== CVEs tab ===== -->
  <section id="tab-cves" class="tab-panel">
    <div id="status-chips" class="chips"></div>

    <div class="filters">
      <input id="f-q" type="search" placeholder="CVE-ID / 説明を検索" />
      <select id="f-status"></select>
      <select id="f-keyword"></select>
      <select id="f-severity"></select>
      <select id="f-sort">
        <option value="published">公開日順</option>
        <option value="first_seen">検出日順</option>
        <option value="score">スコア順</option>
      </select>
    </div>

    <div class="table-wrap">
      <table id="cve-table">
        <thead>
          <tr>
            <th>深刻度</th>
            <th>CVE</th>
            <th>スコア</th>
            <th>公開日</th>
            <th>該当ワード</th>
            <th>ステータス</th>
          </tr>
        </thead>
        <tbody id="cve-rows"></tbody>
      </table>
      <p id="cve-empty" class="muted empty hidden">該当する脆弱性はありません。</p>
    </div>

    <div class="pager">
      <button id="prev-btn" class="btn ghost">前へ</button>
      <span id="page-info" class="muted"></span>
      <button id="next-btn" class="btn ghost">次へ</button>
    </div>
  </section>

  <!-- ===== Watches tab ===== -->
  <section id="tab-watches" class="tab-panel hidden">
    <form id="watch-form" class="watch-form">
      <input id="watch-input" type="text" placeholder="新しい監視ワード (例: openssl)" />
      <button class="btn" type="submit">追加</button>
    </form>
    <ul id="watch-list" class="watch-list"></ul>
  </section>

  <!-- ===== Detail modal ===== -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button id="modal-close" class="modal-close">×</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/app.js"></script>
</body>
</html>
